name: Restore node_modules cache
description: >-
  Restore node_modules from cache; install only on a cache miss. Workspace-aware
  (see .github/scripts/workspace-context.sh): for a workspace member it restores
  the shared repo-root node_modules; standalone packages restore their own. The
  cache key is recomputed here from the lockfile so it is deterministic and does
  not depend on a matrix setup job's (ambiguous) single output.

inputs:
  cache-key:
    description: Deprecated / ignored — the key is recomputed here. Kept for compatibility.
    required: false
    default: ''
  node-version:
    description: Node.js version (must match setup job)
    required: true
  working-directory:
    description: Package directory (use . for the repo root)
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Resolve cache key and paths
      id: paths
      shell: bash
      env:
        PKG_DIR: ${{ inputs.working-directory }}
        NODE_VERSION: ${{ inputs.node-version }}
      run: |
        set -euo pipefail
        read -r INSTALL_DIR SLUG NM < <(bash "${GITHUB_WORKSPACE}/.github/scripts/workspace-context.sh" "${PKG_DIR:-.}")

        if [ "$INSTALL_DIR" = "." ]; then
          LOCK="package-lock.json"; PKG="package.json"
        else
          LOCK="${INSTALL_DIR}/package-lock.json"; PKG="${INSTALL_DIR}/package.json"
        fi

        BASE_KEY="node-modules-${{ runner.os }}-${NODE_VERSION}-${SLUG}"
        FINGERPRINT=""
        [ -f "$LOCK" ] && FINGERPRINT+=$(sha256sum "$LOCK" | awk '{print $1}')
        [ -f "$PKG" ]  && FINGERPRINT+=$(sha256sum "$PKG" | awk '{print $1}')
        [ -z "$FINGERPRINT" ] && FINGERPRINT="no-lock"

        {
          echo "cache-key=${BASE_KEY}-${FINGERPRINT:0:24}"
          echo "restore-key=${BASE_KEY}-"
          echo "install-dir=${INSTALL_DIR}"
          echo "node-modules-path=${NM}"
        } >> "$GITHUB_OUTPUT"

    - name: Restore node_modules cache
      id: cache-node-modules
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.node-modules-path }}
        key: ${{ steps.paths.outputs.cache-key }}
        # Scoped to this package's slug (not a repo-wide prefix) so a partial
        # match can only ever be a stale build of the SAME package, never an
        # unrelated one.
        restore-keys: |
          ${{ steps.paths.outputs.restore-key }}

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      env:
        INSTALL_DIR: ${{ steps.paths.outputs.install-dir }}
      run: |
        set -euo pipefail
        cd "$INSTALL_DIR"
        if [ -f package-lock.json ]; then
          npm ci --ignore-scripts --no-audit --no-fund
        else
          npm install --ignore-scripts --no-audit --no-fund
        fi

    - name: Rebuild native addons
      shell: bash
      env:
        INSTALL_DIR: ${{ steps.paths.outputs.install-dir }}
      run: |
        set -euo pipefail
        cd "$INSTALL_DIR"
        # Rebuild native addons if they are in the dependency chain.
        # npm ci --ignore-scripts skips the node-pre-gyp install step that
        # these packages require to build their binaries.
        for pkg in sqlite3 bcrypt; do
          if npm ls "$pkg" --depth=99 --parseable 2>/dev/null | grep -qE "(^|/)${pkg}$"; then
            npm rebuild "$pkg"
          fi
        done

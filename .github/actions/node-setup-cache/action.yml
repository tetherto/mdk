name: Node.js setup with node_modules cache
description: >-
  Install dependencies once and save node_modules to the Actions cache for
  downstream jobs. Workspace-aware: for a package that is a member of the repo
  root npm `workspaces`, it installs at the workspace root (npm hoists every
  member's deps and bins there) and caches the root node_modules; standalone
  packages install in place. See .github/scripts/workspace-context.sh.

inputs:
  node-version:
    description: Node.js version (e.g. 20.x or lts/*)
    required: true
  install-dependencies:
    description: Run the install before saving cache
    required: false
    default: 'true'
  working-directory:
    description: Package directory (use . for the repo root)
    required: false
    default: '.'

outputs:
  cache-key:
    description: Cache key for node-restore-cache (deterministic; recomputed there too)
    value: ${{ steps.cache-keys.outputs.cache-key }}
  cache-hit:
    description: Whether node_modules was restored from cache
    value: ${{ steps.cache-node-modules.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Generate cache keys
      id: cache-keys
      shell: bash
      env:
        PKG_DIR: ${{ inputs.working-directory }}
        NODE_VERSION: ${{ inputs.node-version }}
      run: |
        set -euo pipefail
        # Resolve where this package installs (root for workspace members).
        read -r INSTALL_DIR SLUG NM < <(bash "${GITHUB_WORKSPACE}/.github/scripts/workspace-context.sh" "${PKG_DIR:-.}")

        if [ "$INSTALL_DIR" = "." ]; then
          LOCK="package-lock.json"; PKG="package.json"
        else
          LOCK="${INSTALL_DIR}/package-lock.json"; PKG="${INSTALL_DIR}/package.json"
        fi

        BASE_KEY="node-modules-${{ runner.os }}-${NODE_VERSION}-${SLUG}"
        FINGERPRINT=""
        [ -f "$LOCK" ] && FINGERPRINT+=$(sha256sum "$LOCK" | awk '{print $1}')
        [ -f "$PKG" ]  && FINGERPRINT+=$(sha256sum "$PKG" | awk '{print $1}')
        [ -z "$FINGERPRINT" ] && FINGERPRINT="no-lock"

        {
          echo "cache-key=${BASE_KEY}-${FINGERPRINT:0:24}"
          echo "base-key=${BASE_KEY}"
          echo "install-dir=${INSTALL_DIR}"
          echo "node-modules-path=${NM}"
        } >> "$GITHUB_OUTPUT"

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      env:
        INSTALL_DIR: ${{ steps.cache-keys.outputs.install-dir }}
      run: |
        set -euo pipefail
        cd "$INSTALL_DIR"
        if [ -f package-lock.json ]; then
          npm ci --ignore-scripts --no-audit --no-fund
        else
          npm install --ignore-scripts --no-audit --no-fund
        fi

    - name: Save node_modules cache
      id: cache-node-modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache-keys.outputs.node-modules-path }}
        key: ${{ steps.cache-keys.outputs.cache-key }}

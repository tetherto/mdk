          # root node_modules above (no-op here).
          if [ ! -d node_modules ] || [ -z "$(ls -A node_modules 2>/dev/null)" ]; then
            npm ci --ignore-scripts --no-audit --no-fund
            for pkg in sqlite3 bcrypt; do
              if npm ls "$pkg" --depth=99 --parseable 2>/dev/null | grep -qE "(^|/)${pkg}$"; then
                npm rebuild "$pkg"
              fi
            done
          fi
      - name: Test with coverage (enforce ≥80%)
        uses: ./.github/actions/test-with-coverage

        with:
          working-directory: ${{ matrix.dir }}

  # Rehearses the npm publish on release PRs (release/* -> main), where package
  # code changes: builds, packs and checks every package that's ready for npm,
  # without publishing anything. The publish workflow runs the same checks
  # again after the merge and stops before publishing if any of them fail.
  pack-check:
    name: 📦 Pack Check
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'release/')
    uses: ./.github/workflows/package-build.yml
    with:
      build-all: true

  security_checks:
    name: 🔐 Security Checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          vulnerability-check: true
          license-check: true

  security_audit_ui:
    name: 🔐 Security Audit UI
    if: github.event_name == 'pull_request' && needs.detect-target.outputs.run_ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-target, setup-ui]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ env.UI_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: ./.github/actions/node-restore-cache
        with:
          cache-key: ${{ needs.setup-ui.outputs.cache-key }}
          node-version: ${{ env.NODE_VERSION }}
          working-directory: ${{ env.UI_DIR }}

      - name: Security audit (npm)
        run: |
          set +e
          npm audit signatures 2>&1
          SIGNATURES_EXIT=$?
          npm audit --audit-level=moderate 2>&1
          MODERATE_EXIT=$?
          npm exec --yes -- audit-ci@7 --config "${GITHUB_WORKSPACE}/.github/scripts/audit-ci.jsonc" 2>&1
          HIGH_EXIT=$?
          set -e
          [ $SIGNATURES_EXIT -eq 0 ] && SIGNATURES_STATUS="PASS" || SIGNATURES_STATUS="WARN"
          [ $MODERATE_EXIT -eq 0 ] && MODERATE_STATUS="PASS" || MODERATE_STATUS="WARN"
          [ $HIGH_EXIT -eq 0 ] && HIGH_STATUS="PASS" || HIGH_STATUS="WARN"
          # Only emit a summary block when the audit found something; a clean
          # PR should not produce a wall of PASS tables.
          if [ $MODERATE_EXIT -ne 0 ] || [ $HIGH_EXIT -ne 0 ]; then
            AUD_JSON="${RUNNER_TEMP:-/tmp}/npm-audit-ui.json"
            npm audit --json > "${AUD_JSON}" 2>/dev/null || true
            {
              echo "## Security Audit — UI (\`${{ env.UI_DIR }}\`)"
              echo ""
              echo "| Signatures | Moderate | High/Critical (audit-ci) |"
              echo "|---|---|---|"
              echo "| ${SIGNATURES_STATUS} | ${MODERATE_STATUS} | ${HIGH_STATUS} |"
            } >> "$GITHUB_STEP_SUMMARY"
            bash "${GITHUB_WORKSPACE}/.github/scripts/github-summary-npm-audit-high-critical.sh" "${AUD_JSON}" >> "$GITHUB_STEP_SUMMARY" || true
          fi
          [ $HIGH_EXIT -eq 0 ]

  security_audit_core:
    name: 🔐 Security Audit Core (${{ matrix.dir }})
    if: github.event_name == 'pull_request' && needs.detect-target.outputs.run_core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-target, list-core, setup-core]
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.list-core.outputs.dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: ./.github/actions/node-restore-cache
        with:
          cache-key: ${{ needs.setup-core.outputs.cache-key }}
          node-version: ${{ env.NODE_VERSION }}
          working-directory: ${{ matrix.dir }}

      - name: Security audit (npm)
        run: |
          set +e
          # Workspace members share the root lockfile/node_modules (see
          # workspace-context.sh); audit-ci needs a lockfile in its cwd to
          # detect the package manager, so audit from the resolved install
          # dir instead of always matrix.dir.
          read -r INSTALL_DIR _slug _nm < <(bash "${GITHUB_WORKSPACE}/.github/scripts/workspace-context.sh" "${{ matrix.dir }}")
          cd "${GITHUB_WORKSPACE}/${INSTALL_DIR}"
          npm audit signatures 2>&1
          SIGNATURES_EXIT=$?
          npm audit --audit-level=moderate 2>&1
          MODERATE_EXIT=$?
          npm exec --yes -- audit-ci@7 --config "${GITHUB_WORKSPACE}/.github/scripts/audit-ci.jsonc" 2>&1
          HIGH_EXIT=$?
          set -e
          [ $SIGNATURES_EXIT -eq 0 ] && SIGNATURES_STATUS="PASS" || SIGNATURES_STATUS="WARN"
          [ $MODERATE_EXIT -eq 0 ] && MODERATE_STATUS="PASS" || MODERATE_STATUS="WARN"
          [ $HIGH_EXIT -eq 0 ] && HIGH_STATUS="PASS" || HIGH_STATUS="WARN"
          # Only emit a per-package summary block when the audit found
          # something; a clean PR should not produce a wall of PASS tables.
          if [ $MODERATE_EXIT -ne 0 ] || [ $HIGH_EXIT -ne 0 ]; then
            SAFE_NAME=$(echo "${{ matrix.dir }}" | tr '/' '-')
            AUD_JSON="${RUNNER_TEMP:-/tmp}/npm-audit-${SAFE_NAME}.json"
            npm audit --json > "${AUD_JSON}" 2>/dev/null || true
            {
              echo "## Security Audit — Core (\`${{ matrix.dir }}\`)"
              echo ""
              echo "| Signatures | Moderate | High/Critical (audit-ci) |"
              echo "|---|---|---|"
              echo "| ${SIGNATURES_STATUS} | ${MODERATE_STATUS} | ${HIGH_STATUS} |"
            } >> "$GITHUB_STEP_SUMMARY"
            bash "${GITHUB_WORKSPACE}/.github/scripts/github-summary-npm-audit-high-critical.sh" "${AUD_JSON}" >> "$GITHUB_STEP_SUMMARY" || true
          fi
          [ $HIGH_EXIT -eq 0 ]

  security_audit_workers:
    name: 🔐 Security Audit Worker (${{ matrix.dir }})
    if: github.event_name == 'pull_request' && needs.detect-target.outputs.run_workers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-target, list-workers, setup-workers]
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.list-workers.outputs.dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: ./.github/actions/node-restore-cache
        with:
          cache-key: ${{ needs.setup-workers.outputs.cache-key }}
          node-version: ${{ env.NODE_VERSION }}
          working-directory: ${{ matrix.dir }}

      - name: Security audit (npm)
        run: |
          set +e
          # Workspace members share the root lockfile/node_modules (see
          # workspace-context.sh); audit-ci needs a lockfile in its cwd to
          # detect the package manager, so audit from the resolved install
          # dir instead of always matrix.dir.
          read -r INSTALL_DIR _slug _nm < <(bash "${GITHUB_WORKSPACE}/.github/scripts/workspace-context.sh" "${{ matrix.dir }}")
          cd "${GITHUB_WORKSPACE}/${INSTALL_DIR}"
          npm audit signatures 2>&1
          SIGNATURES_EXIT=$?
          npm audit --audit-level=moderate 2>&1
          MODERATE_EXIT=$?
          npm exec --yes -- audit-ci@7 --config "${GITHUB_WORKSPACE}/.github/scripts/audit-ci.jsonc" 2>&1
          HIGH_EXIT=$?
          set -e
          [ $SIGNATURES_EXIT -eq 0 ] && SIGNATURES_STATUS="PASS" || SIGNATURES_STATUS="WARN"
          [ $MODERATE_EXIT -eq 0 ] && MODERATE_STATUS="PASS" || MODERATE_STATUS="WARN"
          [ $HIGH_EXIT -eq 0 ] && HIGH_STATUS="PASS" || HIGH_STATUS="WARN"
          # Only emit a per-package summary block when the audit found
          # something; a clean PR should not produce a wall of PASS tables.
          if [ $MODERATE_EXIT -ne 0 ] || [ $HIGH_EXIT -ne 0 ]; then
            SAFE_NAME=$(echo "${{ matrix.dir }}" | tr '/' '-')
            AUD_JSON="${RUNNER_TEMP:-/tmp}/npm-audit-${SAFE_NAME}.json"
            npm audit --json > "${AUD_JSON}" 2>/dev/null || true
            {
              echo "## Security Audit — Workers (\`${{ matrix.dir }}\`)"
              echo ""
              echo "| Signatures | Moderate | High/Critical (audit-ci) |"
              echo "|---|---|---|"
              echo "| ${SIGNATURES_STATUS} | ${MODERATE_STATUS} | ${HIGH_STATUS} |"
            } >> "$GITHUB_STEP_SUMMARY"
            bash "${GITHUB_WORKSPACE}/.github/scripts/github-summary-npm-audit-high-critical.sh" "${AUD_JSON}" >> "$GITHUB_STEP_SUMMARY" || true
          fi
          [ $HIGH_EXIT -eq 0 ]

  coverage-summary:
    name: 📊 Coverage Summary (per domain)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && !cancelled()
    needs: [detect-target, test-core, test-mdk, coverage-mdk, test-workers]
    steps:
      - name: Download coverage rows
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          path: rows
          pattern: covrow-*
      - name: Render per-domain coverage tables
        shell: bash
        run: |
          set -euo pipefail
          find rows -name coverage-row.tsv -exec cat {} + > all.tsv 2>/dev/null || true
          if [ ! -s all.tsv ]; then
            echo "No coverage rows were produced this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pct () { [ "$1" = "—" ] && printf '—' || printf '%s%%' "$1"; }
          render () {
            local title="$1" prefix="$2" body
            body=$(grep -E "^${prefix}" all.tsv || true)
            [ -z "$body" ] && return 0
            {
              echo "## Coverage — ${title}"
              echo ""
              echo "| Package | Status | Statements | Branches | Functions | Lines |"
              echo "|---|:--|--:|--:|--:|--:|"
              while IFS=$'\t' read -r pkg status stmt br fn ln; do
                [ -z "$pkg" ] && continue
                case "$status" in
                  PASS) icon="✅" ;; FAIL|TESTS-FAILED) icon="❌" ;; *) icon="⚠️" ;;
                esac
                echo "| \`${pkg}\` | ${icon} ${status} | $(pct "$stmt") | $(pct "$br") | $(pct "$fn") | $(pct "$ln") |"
              done <<< "$body"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          }
          render "Core" "backend/core/"
          render "Workers" "backend/workers/"

  summary:
    name: 📋 CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && !cancelled()
    needs:
      - detect-target
      - security_checks
      - security_audit_ui
      - security_audit_core
      - security_audit_workers
      - setup-ui
      - lint-ui
      - typecheck-ui
      - test-ui
      - coverage-ui
      - build-ui
      - list-core
      - setup-core
      - lint-core
      - typecheck-core
      - test-core
      - test-mdk
      - coverage-mdk
      - build-core
      - list-workers
      - setup-workers
      - lint-workers
      - typecheck-workers
      - test-workers
      - build-workers
      - list-examples
      - setup-examples
      - test-examples
      - coverage-summary
      - pack-check
    steps:
      - name: Write job summary
        shell: bash
        env:
          REASON: ${{ needs.detect-target.outputs.reason }}
          RUN_UI: ${{ needs.detect-target.outputs.run_ui }}
          RUN_CORE: ${{ needs.detect-target.outputs.run_core }}
          RUN_WORKERS: ${{ needs.detect-target.outputs.run_workers }}
          RUN_EXAMPLES: ${{ needs.detect-target.outputs.run_examples }}
          SEC: ${{ needs.security_checks.result || 'skipped' }}
          SEC_UI: ${{ needs.security_audit_ui.result || 'skipped' }}
          SEC_CORE: ${{ needs.security_audit_core.result || 'skipped' }}
          SEC_WRK: ${{ needs.security_audit_workers.result || 'skipped' }}
          UI_SETUP: ${{ needs.setup-ui.result || 'skipped' }}
          CORE_SETUP: ${{ needs.setup-core.result || 'skipped' }}
          WRK_SETUP: ${{ needs.setup-workers.result || 'skipped' }}
          EX_SETUP: ${{ needs.setup-examples.result || 'skipped' }}
          EX_TEST: ${{ needs.test-examples.result || 'skipped' }}
          PACK: ${{ needs.pack-check.result || 'skipped' }}
        run: |
          ic() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "🚫" ;;
              skipped) echo "⏭️" ;;
              *) echo "❔" ;;
            esac
          }
          {
            echo "## CI Summary (mdk monorepo)"
            echo ""
            echo "**Selection:** ${REASON} (ui=${RUN_UI} core=${RUN_CORE} workers=${RUN_WORKERS} examples=${RUN_EXAMPLES})"
            echo ""
            echo "| Area | Setup | Security |"
            echo "|---|---|---|"
            echo "| 🔐 Dependency review | — | $(ic "${SEC}") \`${SEC}\` |"
            echo "| 🎨 UI | $(ic "${UI_SETUP}") \`${UI_SETUP}\` | $(ic "${SEC_UI}") \`${SEC_UI}\` |"
            echo "| 🧱 Core | $(ic "${CORE_SETUP}") \`${CORE_SETUP}\` | $(ic "${SEC_CORE}") \`${SEC_CORE}\` |"
            echo "| ⚙️ Workers | $(ic "${WRK_SETUP}") \`${WRK_SETUP}\` | $(ic "${SEC_WRK}") \`${SEC_WRK}\` |"
            echo "| 📋 Examples | $(ic "${EX_SETUP}") \`${EX_SETUP}\` (test: $(ic "${EX_TEST}") \`${EX_TEST}\`) | — |"
            echo "| 📦 Pack check | $(ic "${PACK}") \`${PACK}\` | — |"
            echo ""
            echo "### What ran"
            echo "- **Lockfile consistency** in setup jobs (root lock for workspace members, own lock for standalone packages)"
            echo "- **Workspace-aware install**: members install once at the repo root and share the hoisted \`node_modules\` cache; standalone packages install in place"
            echo "- **PR:** dependency review + per-package npm audits (audit-ci for high/critical)"
          } >> "$GITHUB_STEP_SUMMARY"

  build-workers:
    name: 🏗️ Build Worker (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [detect-target, list-workers, setup-workers]
    if: needs.detect-target.outputs.run_workers == 'true' && needs.list-workers.outputs.buildable_dirs != '[]'
    strategy:

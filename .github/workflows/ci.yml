            echo "::error::package-lock.json (${LOCK_DIR}) is out of sync with package.json."
            echo "::error::Regenerate with: (cd ${LOCK_DIR} && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)"
            exit 1

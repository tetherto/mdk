    needs: [detect-target, list-core, setup-core]
    if: needs.detect-target.outputs.run_core == 'true'
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.list-core.outputs.test_dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-restore-cache
        with:
          cache-key: ${{ needs.setup-core.outputs.cache-key }}
          node-version: ${{ env.NODE_VERSION }}
          working-directory: ${{ matrix.dir }}
      - name: Ensure workspace dependencies (sibling resolution)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # Core packages relative-require sibling core packages (e.g. mdk ->
          # kernel) and backend/workers/** packages. All are npm workspace
          # members, so a single install at the workspace root hoists their deps
          # and makes the requires resolve. Member jobs already restored the root
          # node_modules above (no-op here); standalone jobs install it here.
          if [ ! -d node_modules ] || [ -z "$(ls -A node_modules 2>/dev/null)" ]; then
            npm ci --ignore-scripts --no-audit --no-fund
            for pkg in sqlite3 bcrypt; do
              if npm ls "$pkg" --depth=99 --parseable 2>/dev/null | grep -qE "(^|/)${pkg}$"; then
                npm rebuild "$pkg"
              fi
            done
          fi
      - name: Test with coverage (enforce ≥80%)
        uses: ./.github/actions/test-with-coverage
        with:
          working-directory: ${{ matrix.dir }}
          min: "80"

  # mdk is sharded across parallel runners: its integration suite (real worker
  # discovery, ~16-40s per test) is too slow for one 20-min job. Shards split by
  # cost — fast unit vs the slow actions-flow suites. Each shard writes its own
  # coverage; coverage-mdk merges them and enforces the ≥80% gate.
  test-mdk:
    name: 🧩 Test Core shard — mdk [${{ matrix.shard }}]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-target, list-core, setup-core]
    if: needs.detect-target.outputs.run_core == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Shard by test group so the slow integration suites run on separate
        # runners (dir-based globs, robust to files being added/removed).
        shard: [unit, miners, containers, other]
    defaults:
      run:
        working-directory: backend/core/mdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-restore-cache
        with:
          cache-key: ${{ needs.setup-core.outputs.cache-key }}
          node-version: ${{ env.NODE_VERSION }}
          working-directory: backend/core/mdk
      - name: Ensure workspace dependencies (sibling resolution)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # mdk relative-requires kernel/client/mdk-worker and backend/workers/**;
          # all are workspace members, hoisted by a single root install. Member
          # jobs already restored the root node_modules above (no-op here).
          if [ ! -d node_modules ] || [ -z "$(ls -A node_modules 2>/dev/null)" ]; then
            npm ci --ignore-scripts --no-audit --no-fund
            for pkg in sqlite3 bcrypt; do
              if npm ls "$pkg" --depth=99 --parseable 2>/dev/null | grep -qE "(^|/)${pkg}$"; then
                npm rebuild "$pkg"
              fi
            done
          fi
      - name: Run shard with coverage
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          case "$SHARD" in
            unit)       GLOB='tests/unit/**/*.test.js' ;;
            miners)     GLOB='tests/integration/actions-flow/miners/*.test.js' ;;
            containers) GLOB='tests/integration/actions-flow/containers/*.test.js' ;;
            other)      GLOB='tests/integration/*.test.js' ;;  # top-level only (* is single-level)
            *) echo "::error::unknown shard $SHARD"; exit 1 ;;
          esac
          rm -rf coverage
          NODE_ENV=test npx brittle --coverage "$GLOB"
          [ -f coverage/coverage-final.json ] || { echo "::error::no coverage-final.json for shard $SHARD"; exit 1; }
          cp coverage/coverage-final.json "coverage/mdk-cov-$SHARD.json"
      - name: Upload shard coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mdk-cov-${{ matrix.shard }}
          path: backend/core/mdk/coverage/mdk-cov-${{ matrix.shard }}.json
          retention-days: 1

  coverage-mdk:
    name: 📊 Coverage Merge (backend/core/mdk)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-target, test-mdk]
    if: needs.detect-target.outputs.run_core == 'true'
    defaults:
      run:
        working-directory: backend/core/mdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download shard coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: backend/core/mdk/coverage-parts
          pattern: mdk-cov-*
          merge-multiple: true
      - name: Merge coverage and enforce ≥80%
        shell: bash
        run: |
          set -euo pipefail
          MIN=80
          rm -rf .nyc_output && mkdir -p .nyc_output
          npx --yes nyc@17.1.0 merge coverage-parts .nyc_output/out.json
          set +e
          npx --yes nyc@17.1.0 check-coverage --lines=$MIN --statements=$MIN --functions=$MIN --branches=$MIN
          EXIT=$?
          set -e
          REPORT="$(npx --yes nyc@17.1.0 report --reporter=text-summary 2>&1)"
          echo "$REPORT"
          STMT=$(echo "$REPORT" | sed -n 's/^Statements[^:]*: *\([0-9.]*\)%.*/\1/p'); [ -z "$STMT" ] && STMT="—"
          BRANCH=$(echo "$REPORT" | sed -n 's/^Branches[^:]*: *\([0-9.]*\)%.*/\1/p'); [ -z "$BRANCH" ] && BRANCH="—"
          FN=$(echo "$REPORT" | sed -n 's/^Functions[^:]*: *\([0-9.]*\)%.*/\1/p'); [ -z "$FN" ] && FN="—"
          LINES=$(echo "$REPORT" | sed -n 's/^Lines[^:]*: *\([0-9.]*\)%.*/\1/p'); [ -z "$LINES" ] && LINES="—"
          [ $EXIT -eq 0 ] && STATUS="PASS" || STATUS="FAIL"
          # Row consumed by the coverage-summary job (mdk lands in the Core block).
          printf '%s\t%s\t%s\t%s\t%s\t%s\n' "backend/core/mdk" "$STATUS" "$STMT" "$BRANCH" "$FN" "$LINES" > coverage-row.tsv
          exit $EXIT
      - name: Upload coverage row
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: covrow-backend-core-mdk
          path: backend/core/mdk/coverage-row.tsv
          retention-days: 1
          if-no-files-found: ignore


id: io.tether.example.mvp-site
version: 0.12.2
displayName: MVP Site
description: "MVP-site example app: aggregates the site (miners, a powermeter, a mining pool) via the MDK protocol client."
# The Kernel access the site app's account (app:site) gets: list workers, read
# devices (telemetry, capabilities) and write them (setPowerMode, setupPools),
# read the write-command log (the Activity page), and read the policy (to tell
# the UI what the signed-in user may do). A request for a signed-in user is
# allowed only when the user's own roles allow it too.
permissions:
  - resources: [workers]
    verbs: [list]
  - resources: [devices]
    verbs: [read, write]
  - resources: [commands]
    verbs: [read]
  - resources: [policy]
    verbs: [read]
